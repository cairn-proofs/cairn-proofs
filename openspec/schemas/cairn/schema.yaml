name: cairn
version: 1
description: Extends default OpenSpec workflow with a threat model - proposal → specs → design → threat model → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Numbered list (`1.`, `2.`) of changes — numbered so
      each is referenceable downstream. Be specific about new capabilities,
      modifications, or removals. Mark breaking changes with **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Architecture / Sequence diagrams**: include a mermaid architecture
      (`flowchart`/`graph`) and/or sequence (`sequenceDiagram`) diagram per the
      Diagrams rule — architecture when components/boundaries change, sequence
      when a runtime flow changes. A pure-library/rename/config change with no
      structural or flow change may state "Diagrams: N/A — <reason>" instead.

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: threatmodel
    description: A STRIDE-based threat model, kept private, with a sanitized public report
    generates: threat-model-report.md
    template: threat-model-report.md
    requires:
      - specs
      - design
    instruction: |
      Run the `threat-model` skill on this change. Its target is the change
      itself: `proposal.md`, `design.md`, and every spec delta under `specs/`.
      Use the model path `<change-name>.tc.json`. The `threat-composer` MCP
      server writes the model to `threat-models/`, which is a separate, private
      repository. Only the MCP tools write the model.

      The model is private. Never copy threat, mitigation, asset, or system
      text into a file in this repository. This rule applies to `design.md`,
      `tasks.md`, the report, and commit messages.

      - Loop-back: when the skill is done, run
        `python3 openspec/tools/tc.py gate <change-name>`. If a High priority
        threat has no mitigation, amend the spec deltas and `design.md` so that
        a mitigation is possible. Then run the skill again to extend the model.
        Repeat until no High priority threat is without a mitigation. At this
        step, the gate also reports open threats that depend on mitigations
        that are not built yet. That is expected; the apply step resolves them.
      - Medium and Low priority findings carry forward as context for the tasks
        artifact.
      - Last, run `python3 openspec/tools/tc.py report <change-name>`. It writes
        `threat-model-report.md`, which holds only counts, the gate result, and
        the model hash. Do not edit the report.
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Group related tasks under `## N.` headings. Headings help readers. They do not limit which tasks can run together.
      - Order the checklist so that each task comes after every task it depends on. A task depends on an earlier task when it needs that task's code, files, or migrations.
      - Ship each task's tests in the same task as the code they cover.
      - Name the files each task creates or changes when you know them. A harness that runs tasks in parallel uses these names to keep concurrent tasks on different files.
      - Write every task in neutral language. Name the control or the code change, not the threat it addresses. Do not cite threat or mitigation ids. `tasks.md` is public; the threat model is private.
      - After you write `tasks.md`, link the private model to it. Call `tm_get`, then call `tm_add_tags` with `kind: "mitigation"` for each open mitigation that a task in this change builds. Add one `task:<N.M>` tag for each task that builds it. Do not use `tm_update_mitigation` for this; it replaces the whole mitigation. A mitigation that a later change builds gets no `task:` tag. Then run `python3 openspec/tools/tc.py report <change-name>` again, because the model changed.
      - There is no review or simplify pass during implementation. `code-simplifier`, `code-reviewer`, `security-reviewer`, and `tester` run once, after every task is complete, on the cumulative diff (see the apply instruction).

      Reference specs for what needs to be built, design for how to build it.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design
      - threatmodel
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files (proposal, design, specs, tasks). The threat model is
    private; read it through the `threat-composer` MCP tools only.

    Implement the checklist by following the `openspec-apply-change` skill. That skill is the authoritative task-loop procedure, including its `blocked` and `all_done` states and its checkbox rule.

    Use the concurrency of the harness that runs this flow where it is safe. The harness MAY run checklist tasks in parallel when the tasks write different files and every prerequisite of each task is complete. A harness without concurrency support runs the checklist from top to bottom. A task never starts before its prerequisites complete.

    For each task, write the code and the tests that cover it, then run the tests scoped to the touched modules (for example `uv run pytest tests/unit/cairn_<module>/`) until they pass. Do not run a bare repo-wide `pytest`. `mise run check` in the aggregate gate is the one full-suite run. There is no review or simplify pass during implementation.

    After every task is complete, run the single aggregate quality gate once on the cumulative diff, in order:
    1. `code-simplifier`, the one simplify pass for the change. It finds duplication across tasks and re-confirms tests.
    2. `code-reviewer` + `security-reviewer` + `tester` in parallel on the simplified diff. A Critical or High finding blocks. `tester` fills coverage and edge-case gaps.
    3. `mise run check`, the full pre-merge gate.
    To fix findings, give them to an implementer as input, then run the gate again until it is clean.

    Then, BEFORE committing, and ONLY when every task is complete and
    `threat-models/<change-name>.tc.json` exists, reconcile and gate the
    threat model. A paused or partial apply must NOT reconcile.
    a. Run `python3 openspec/tools/tc.py reconcile <change-name>`. It reads the
       checked tasks in `tasks.md` and the `task:` tags on the mitigations. It
       writes nothing. It prints the mitigation ids to set to
       `mitigationResolved` and the threat ids to set to `threatResolved`.
       Exit code 2 means a `task:` tag names a task that is not in `tasks.md`.
       Then apply nothing; fix the tags with `tm_remove_tags` and
       `tm_add_tags`, and run it again.
    b. Apply the printed changes with the MCP tool `tm_set_status`, then run
       `tm_validate`.
    c. Run `python3 openspec/tools/tc.py gate <change-name>`. A non-zero exit
       means the change is NOT done: a High priority threat has no
       mitigation, a threat depends on an unresolved mitigation, or a threat
       has no valid priority. Surface it (see below). Do NOT mark the change
       complete or commit until it is resolved.
    d. Run `python3 openspec/tools/tc.py report <change-name>`, then
       `python3 openspec/tools/tc.py report <change-name> --check`.
    Once the gate passes, the change is ready to commit when the user asks.

    Pause and surface to the user if you hit blockers, ambiguity, or a
    finding that requires a design change.
