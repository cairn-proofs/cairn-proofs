name: bugfix
version: 1
description: Surgical bugfix workflow (Kiro-style) - bugfix-analysis → design → tasks. Captures defect/expected/unchanged behavior explicitly so the fix is reliable and regression-guarded.
artifacts:
  - id: bugfix-analysis
    generates: bugfix.md
    description: Bug definition - defect, expected, and unchanged behavior in WHEN/THEN form
    template: bugfix.md
    requires: []
    instruction: >
      Create `bugfix.md` - the contract for what's broken, what "fixed" means,
      and what MUST keep working.


      The bugfix is the foundation of this workflow; there is no separate
      proposal artifact. The bug itself is the motivation.


      Sections (ALL required, in this order):


      - **Title**: One-line summary. Plain English, not a Jira ID.

      - **Severity & Impact**: One paragraph. Who's affected, how often, what
      they see, blast radius. Reference real signals where possible (alarm
      name, log query, ticket, customer report). Be specific.

      - **Reproduction**: Concrete steps a fresh contributor can follow to
      observe the defect. Include environment (stage, region), inputs,
      observed output. If the bug is only reproducible under load or specific
      data, say so and provide the minimal trigger.

      - **Current Behavior (Defect)**: One or more clauses, each strictly in
      the form:
        > **WHEN** &lt;condition&gt; **THEN** the system &lt;incorrect behavior&gt;

        Note: no SHALL here - this is descriptive of the bug, not normative.

      - **Expected Behavior (Correct)**: One or more clauses, each strictly
      in the form:
        > **WHEN** &lt;condition&gt; **THEN** the system **SHALL** &lt;correct behavior&gt;

        This is the testable definition of "fixed". Every clause must be
        verifiable by an automated test.

      - **Unchanged Behavior (Regression Prevention)**: One or more clauses,
      each strictly in the form:
        > **WHEN** &lt;condition&gt; **THEN** the system **SHALL CONTINUE TO** &lt;existing behavior&gt;

        Enumerate the behaviors at risk from the proposed fix - adjacent
        code paths, shared state, callers of the modified function. This is
        the seed list for the regression test suite in `tasks.md`.

      - **Spec Impact**: One of:
        - "None - the spec already mandates the Expected Behavior; this is
          purely an implementation defect."
        - "Spec amendment needed - &lt;capability&gt; spec is ambiguous about
          &lt;condition&gt;; the fix will be accompanied by a delta spec
          updating Requirement &lt;name&gt;." (Then create the delta spec
          alongside `design.md`.)


      Format rules:

      - Use the exact bolded keywords **WHEN**, **THEN**, **SHALL**, **SHALL
      CONTINUE TO**. Linters and downstream review depend on this.

      - One clause per NUMBERED item (`1.`, `2.`), not a bullet — downstream
      artifacts cite them as "clause #N", so the number is the referenceable
      handle. No compound clauses joined with "and" - split them so each is
      independently testable.

      - Keep clauses concrete enough that a property-based test can be
      written against them.


      The bugfix.md is the contract. Everything downstream (root cause,
      fix design, tests) must trace back to a clause here.
  - id: design
    generates: design.md
    description: Root-cause analysis, fix approach, and test property categories
    template: design.md
    requires:
      - bugfix-analysis
    instruction: >
      Create `design.md` - the engineering reasoning behind the fix.


      Read `bugfix.md` first. Every section here references its clauses.


      Sections (ALL required, in this order):


      - **Root Cause Analysis**: Walk the reader from the symptom in
      `bugfix.md`'s Current Behavior clauses to the underlying defect in
      the code. Cite file paths and line numbers (e.g.,
      `libs/oscal/dispatch.py:142`). Name the precise mechanism (off-by-one,
      missing await, wrong KMS key id, race on shared module-level state,
      etc.). If the root cause spans multiple files, list each.

      - **Why It Wasn't Caught**: One paragraph. Which test was supposed to
      cover this and why didn't it? (Missing case, mocked dependency that
      diverged from prod, test only ran serially, etc.) This shapes the
      regression tests in the next section.

      - **Proposed Fix**: The change. Be specific - which functions,
      which lines, what behavior changes. Include the minimal code
      sketch where helpful. Call out the trade-off: why this fix vs.
      alternatives considered. Surgical &gt; comprehensive - if you find
      yourself proposing a refactor, ask whether that should be a
      follow-up change instead.

      - **Blast Radius**: Numbered list (`1.`, `2.`) of files/modules touched,
      and a one-line "who else calls this" note for each modified function.
      Number them so a regression-guard task can cite "blast-radius #2". This
      list bounds the regression-test scope in `tasks.md`.

      - **Test Properties**: Three subsections - one per category. Each
      subsection lists the properties that will be encoded as automated
      tests in `tasks.md`. Frame each as a property-based assertion
      (input shape → invariant), not a single example. The project uses
      Hypothesis for Python property tests; reference existing
      `tests/unit/cairn_*/` patterns.

        - **(a) Bug Reproduction (RED)**: Properties that FAIL on
          `main` (the unfixed code) and PASS on the fix branch. These
          encode the Expected Behavior clauses from `bugfix.md`. Each
          property must trace to a specific Expected Behavior clause.

        - **(b) Fix Verification (GREEN)**: Properties that PASS on
          the fix branch. Often the same set as (a) - explicitly note
          if they diverge (e.g., fix-only invariants that don't make
          sense to assert against unfixed code).

        - **(c) Regression Guard**: Properties that PASS on `main` AND
          MUST CONTINUE TO PASS on the fix branch. These encode the
          Unchanged Behavior clauses from `bugfix.md` plus any behavior
          identified in the Blast Radius that the fix could plausibly
          disturb. Err on the side of more guards here - they're cheap
          to write and catch the class of regression this workflow
          exists to prevent.

      - **Spec Alignment**: If `bugfix.md` flagged a spec amendment,
      describe the delta here and create the delta spec file at
      `openspec/changes/&lt;name&gt;/specs/&lt;capability&gt;/spec.md` following
      the project's MODIFIED Requirements conventions (full updated
      content, exact header match, NO phase annotations — specs describe
      current state, so spec deltas MUST NOT introduce `*Phase:*` lines).
      If no spec
      change, write "Spec already mandates the Expected Behavior; no
      delta needed."

      - **Rollback**: One paragraph. How to revert if the fix introduces
      a worse bug. For most fixes this is "revert the commit, no state
      to unwind." Call out explicitly if a migration, schema change, or
      operational step makes rollback non-trivial.


      Keep design.md focused on THIS bug. Tangentially related issues
      become follow-up changes, not scope creep here.
  - id: tasks
    generates: tasks.md
    description: Implementation checklist, ordered RED→GREEN→Regression
    template: tasks.md
    requires:
      - bugfix-analysis
      - design
    instruction: |
      Create `tasks.md` - the implementation checklist.

      **IMPORTANT: Follow the template exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.

      Bugfix-workflow task structure (recommended; adapt for scope):

      - **Group 1 - Bug Reproduction (RED)**: Write the failing tests
        FIRST, on a clean tree, and confirm they fail against current
        code. One task per property from design.md "Test Properties
        (a) Bug Reproduction". These tests are the contract; if they
        don't fail now, the bug isn't characterized correctly and
        design.md needs revision.

      - **Group 2 - Fix**: Implement the change from design.md
        "Proposed Fix". Touch only the files in "Blast Radius". When
        this group completes, the Group 1 tests must turn GREEN.

      - **Group 3 - Regression Guard**: Write the tests from design.md
        "Test Properties (c) Regression Guard". These should pass both
        before and after the fix; they exist to catch future regressions
        and document what the fix MUST NOT break.

      - **Group 4 - Spec Sync** (only if `bugfix.md`'s "Spec Impact"
        flagged an amendment): Create or update the delta spec at
        `openspec/changes/<name>/specs/<capability>/spec.md` per the
        design's "Spec Alignment" section. Run `mise run spec-validate`.

      Guidelines:
      - Group related tasks under `## N.` headings. Headings help readers. They do not limit which tasks can run together.
      - Order the checklist so that each task comes after every task it depends on. A task depends on an earlier task when it needs that task's code, files, or migrations.
      - Order the checklist as RED reproduction tests first, then the fix, then regression guards. Every RED task comes before every fix task, and the RED tests are confirmed to fail against the unfixed code before the fix starts.
      - Ship each task's tests in the same task as the code they cover, except the RED reproduction tests, which ship in Group 1 before the fix.
      - Name the files each task creates or changes when you know them. A harness that runs tasks in parallel uses these names to keep concurrent tasks on different files.
      - There is no review or simplify pass during implementation. `code-simplifier`, `code-reviewer`, `security-reviewer`, and `tester` run once, after every task is complete, on the cumulative diff (see the apply instruction).
      - No checklist task runs `mise run check`. The aggregate gate runs it once after every task is complete, and it confirms that the Group 1 RED tests now pass and the Group 3 regression guards still pass.

      Each task should be verifiable - you know when it's done.
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files (bugfix.md, design.md, tasks.md, any spec deltas).

    Implement the checklist by following the `openspec-apply-change` skill. That skill is the authoritative task-loop procedure, including its `blocked` and `all_done` states and its checkbox rule.

    Use the concurrency of the harness that runs this flow where it is safe. The harness MAY run checklist tasks in parallel when the tasks write different files and every prerequisite of each task is complete. A harness without concurrency support runs the checklist from top to bottom. A task never starts before its prerequisites complete.

    For each task, write the code and the tests that cover it, then run the tests scoped to the touched modules (for example `uv run pytest tests/unit/cairn_<module>/`) until they pass. Do not run a bare repo-wide `pytest`. `mise run check` in the aggregate gate is the one full-suite run. There is no review or simplify pass during implementation. For a RED reproduction task, confirm that the tests fail against the unfixed code and record the failure output. If they pass, stop and surface it: the root cause in `design.md` needs revision before any fix task starts.

    After every task is complete, run the single aggregate quality gate once on the cumulative diff, in order:
    1. `code-simplifier`, the one simplify pass for the change. It finds duplication across tasks and re-confirms tests.
    2. `code-reviewer` + `security-reviewer` + `tester` in parallel on the simplified diff. A Critical or High finding blocks. `tester` fills coverage and edge-case gaps.
    3. `mise run check`, the full pre-merge gate.
    To fix findings, give them to an implementer as input, then run the gate again until it is clean.

    Pause and surface to the user if you hit blockers, ambiguity, or
    a finding that requires re-opening `bugfix.md` or `design.md`.
