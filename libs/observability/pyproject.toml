[project]
name = "cairn-observability"
version = "0.1.0"
description = "Shared observability utilities for Cairn Provenance_System Lambdas (OTel context, structured logging, CloudWatch metrics)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-logging>=0.48b0",
  "opentelemetry-instrumentation-botocore>=0.48b0",  # emits botocore (boto3) AWS-call subsegments under the handler span
  # We bundle our own OTel now — the deployment uses a COLLECTOR-ONLY ADOT
  # layer (Go binary, no Python SDK), so the application installs the SDK
  # TracerProvider itself (see configure_tracing). No version skew because
  # the layer ships no Python.
  "opentelemetry-sdk-extension-aws>=2.0.0",  # AwsXRayIdGenerator (X-Ray-compatible trace IDs)
  "opentelemetry-propagator-aws-xray>=1.0.0",  # registers the `xray` propagator entry point (OTEL_PROPAGATORS=...,xray)
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",  # OTLPSpanExporter → collector OTLP HTTP receiver
  "aws-lambda-powertools[metrics]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_observability"]
