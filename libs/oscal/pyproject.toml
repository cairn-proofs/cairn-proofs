[project]
name = "cairn-oscal"
version = "0.1.0"
description = "OSCAL extraction adapter for the Cairn Provenance_System: schema-version cross-check, metadata extraction, OSCAL artifact reference generation. Thin layer over oscal-bindings."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.5.0",
  # OSCAL data bindings (pydantic v2 models + OscalDoc facade + back-matter
  # builders), published on PyPI from github.com/cairn-proofs/oscal-bindings-python.
  # Exact pin: the generated models define what the validate path accepts.
  "oscal-bindings==0.3.1",
  "cairn-oci",
]

[tool.uv.sources]
cairn-oci = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_oscal"]
