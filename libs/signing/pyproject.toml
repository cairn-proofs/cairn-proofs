[project]
name = "cairn-signing"
version = "0.1.0"
description = "Thin wrapper around Notation CLI for AWS Signer pipeline signing in the Cairn Provenance_System"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_signing"]
