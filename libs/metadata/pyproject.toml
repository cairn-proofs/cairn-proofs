[project]
name = "cairn-metadata"
version = "0.1.0"
description = "DynamoDB access library for the Cairn Provenance_System Metadata_Index (table + GSI1, conditional writes, pagination)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cairn-oci",
  "boto3>=1.43.14,<2",
]

[tool.uv.sources]
cairn-oci = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_metadata"]
