[project]
name = "cairn-validation"
version = "0.1.0"
description = "Bundle validation and cross-checks for the Cairn Provenance_System ([INGEST-016], [INGEST-017], [PIPELINE-010], [PIPELINE-013])"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cairn-oci",
  "pydantic>=2.13.4,<3",
]

[tool.uv.sources]
cairn-oci = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_validation"]
