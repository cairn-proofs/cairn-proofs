[project]
name = "cairn-lambda-sign-bundle"
version = "0.1.0"
description = "sign-bundle Lambda: signs validated Artifact_Bundles via Notation + AWS Signer and emits artifact.signed"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.34.0",
  "cairn-oci",
  "cairn-signing",
  "cairn-metadata",
  "cairn-observability",
  "aws-lambda-powertools[metrics]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_lambda_sign_bundle"]

[tool.uv.sources]
cairn-oci = { workspace = true }
cairn-signing = { workspace = true }
cairn-metadata = { workspace = true }
cairn-observability = { workspace = true }
