[project]
name = "cairn-lambda-archive-to-s3"
version = "0.1.0"
description = "archive-to-s3 Lambda: archives signed Artifact_Bundles to S3, generates WORM_Receipt, emits artifact.archived"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.14,<2",
  "cairn-oci",
  "cairn-observability",
  "aws-lambda-powertools[metrics]>=3.29.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_lambda_archive_to_s3"]

[tool.uv.sources]
cairn-oci = { workspace = true }
cairn-observability = { workspace = true }
