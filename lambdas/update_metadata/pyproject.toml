[project]
name = "cairn-lambda-update-metadata"
version = "0.1.0"
description = "update-metadata Lambda: applies conditional DynamoDB writes for every evidence.* pipeline event"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.43.14,<2",
  "cairn-metadata",
  "cairn-oci",
  "cairn-observability",
  "aws-lambda-powertools[metrics]>=3.29.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_lambda_update_metadata"]

[tool.uv.sources]
cairn-metadata = { workspace = true }
cairn-oci = { workspace = true }
cairn-observability = { workspace = true }
